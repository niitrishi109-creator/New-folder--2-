
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101020">
<title>Daksha Paints | Animated Advertisement</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #101020;
    color: white;
    min-height: 100vh;
}

.ad {
    --orange: #ff7b22;
    --pink: #ff3c91;
    --blue: #5c75ff;
    --yellow: #ffd84d;

    position: relative;
    width: 100%;
    min-height: 440px;
    height: min(680px, 80vh);
    overflow: hidden;
    isolation: isolate;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px;
    background:
        radial-gradient(ellipse at 15% 15%, #5430a5 0%, transparent 40%),
        radial-gradient(ellipse at 90% 85%, #9d245e 0%, transparent 40%),
        linear-gradient(135deg, #111127, #19132c 55%, #101020);
}

.ad::before,
.ad::after {
    content: "";
    position: absolute;
    z-index: -1;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    filter: blur(3px);
    opacity: .7;
    animation: float 7s ease-in-out infinite alternate;
}

.ad::before {
    top: -90px;
    left: -70px;
    background: var(--pink);
}

.ad::after {
    right: -90px;
    bottom: -100px;
    background: var(--blue);
    animation-delay: -3s;
}

.paint-stroke {
    position: absolute;
    width: 160%;
    height: 65px;
    left: -30%;
    border-radius: 50%;
    opacity: .7;
    filter: blur(1px);
    transform: rotate(-17deg);
    animation: paintMove 9s ease-in-out infinite alternate;
}

.stroke-one {
    top: 18%;
    background: linear-gradient(90deg,
        transparent, #ff3c91, #ff7b22, #ffd84d, transparent);
}

.stroke-two {
    bottom: 18%;
    background: linear-gradient(90deg,
        transparent, #5c75ff, #9b5cff, #ff3c91, transparent);
    animation-delay: -4s;
}

.splash {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: 0 0 25px currentColor;
    animation: sparkle 3s ease-in-out infinite;
}

.s1 { top: 25%; left: 16%; color: #ffd84d; }
.s2 { top: 35%; right: 18%; color: #ff3c91; animation-delay: .7s; }
.s3 { bottom: 30%; left: 22%; color: #5c75ff; animation-delay: 1.4s; }
.s4 { bottom: 22%; right: 20%; color: #ff7b22; animation-delay: .3s; }

.content {
    width: 100%;
    max-width: 800px;
    position: relative;
    z-index: 2;
}

.tag {
    display: inline-block;
    padding: 9px 16px;
    border: 1px solid #ffffff50;
    background: #ffffff12;
    backdrop-filter: blur(8px);
    border-radius: 50px;
    letter-spacing: 2px;
    font-size: 12px;
    font-weight: bold;
    animation: fadeUp .8s both;
}

.logo {
    margin-top: 24px;
    font-size: clamp(35px, 7vw, 76px);
    font-weight: 1000;
    line-height: 1;
    letter-spacing: -2px;
    background: linear-gradient(90deg, #fff, #ffd84d, #ff7b22, #ff3c91);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: fadeUp 1s .2s both, shine 5s linear infinite;
}

.subtitle {
    margin-top: 13px;
    font-size: clamp(14px, 2.5vw, 22px);
    font-weight: bold;
    letter-spacing: 4px;
    color: #ffffffdc;
    animation: fadeUp 1s .4s both;
}

.wall {
    height: 100px;
    max-width: 450px;
    margin: 28px auto 24px;
    display: flex;
    gap: 5px;
    padding: 7px;
    border: 5px solid #ffffffc9;
    border-bottom: 12px solid #ffffffc9;
    border-radius: 8px 8px 3px 3px;
    background: #fff;
    box-shadow: 0 15px 45px #0007;
    overflow: hidden;
    animation: fadeUp .9s .5s both;
}

.wall span {
    flex: 1;
    border-radius: 3px;
    transform: scaleY(.05);
    transform-origin: bottom;
    animation: wallPaint 1.1s forwards;
}

.wall span:nth-child(1) {
    background: #ff7b22;
    animation-delay: .3s;
}

.wall span:nth-child(2) {
    background: #ffd84d;
    animation-delay: .6s;
}

.wall span:nth-child(3) {
    background: #ff3c91;
    animation-delay: .9s;
}

.wall span:nth-child(4) {
    background: #5c75ff;
    animation-delay: 1.2s;
}

.wall span:nth-child(5) {
    background: #39d6a1;
    animation-delay: 1.5s;
}

.message {
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 3.5vw, 30px);
    font-weight: 800;
    animation: fadeUp 1s .7s both;
}

.message span {
    display: inline-block;
    animation: messageSwap 12s infinite;
}

.services {
    margin: 12px auto 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    animation: fadeUp 1s .8s both;
}

.services span {
    padding: 9px 12px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 50px;
    background: #ffffff17;
    border: 1px solid #ffffff38;
}

.cta {
    display: inline-block;
    padding: 15px 24px;
    border-radius: 50px;
    text-decoration: none;
    color: #171020;
    font-size: 15px;
    font-weight: 900;
    background: linear-gradient(90deg, #ffd84d, #ff8b3d);
    box-shadow: 0 0 25px #ff8b3d55;
    transition: transform .25s, box-shadow .25s;
    animation: pulse 2s infinite;
}

.cta:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px #ff8b3d99;
}

.phone {
    margin-top: 17px;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
}

.location {
    margin-top: 9px;
    font-size: 12px;
    color: #ffffffbd;
}

.progress {
    position: absolute;
    z-index: 3;
    left: 0;
    bottom: 0;
    height: 4px;
    width: 100%;
    background: #ffffff20;
}

.progress::after {
    content: "";
    display: block;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff3c91, #ffd84d, #5c75ff);
    transform-origin: left;
    animation: progress 24s linear infinite;
}

.replay {
    position: absolute;
    z-index: 4;
    top: 12px;
    right: 12px;
    border: 1px solid #ffffff60;
    color: white;
    background: #111827cc;
    border-radius: 30px;
    padding: 9px 13px;
    cursor: pointer;
}

@keyframes float {
    to { transform: translate(65px, 45px) scale(1.25); }
}

@keyframes paintMove {
    from { translate: -4% 0; rotate: -3deg; }
    to { translate: 4% 15px; rotate: 3deg; }
}

@keyframes sparkle {
    0%, 100% { transform: scale(.5); opacity: .4; }
    50% { transform: scale(1.7); opacity: 1; }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes shine {
    to { background-position: 250% center; }
}

@keyframes wallPaint {
    to { transform: scaleY(1); }
}

@keyframes pulse {
    0%, 100% { box-shadow: 0 0 15px #ff8b3d44; }
    50% { box-shadow: 0 0 30px #ff8b3dcc; }
}

@keyframes progress {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
}

@keyframes messageSwap {
    0%, 5% { opacity: 0; transform: translateY(12px); }
    10%, 35% { opacity: 1; transform: translateY(0); }
    40%, 100% { opacity: 0; transform: translateY(-12px); }
}

/* Website par normal banner */
body.website-mode {
    padding: 0;
}

/* Reel/Shorts ke liye vertical video canvas */
body.reel-mode {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #080810;
}

body.reel-mode .ad {
    width: min(100vw, 56.25vh);
    height: min(177.7778vw, 100vh);
    min-height: 0;
    aspect-ratio: 9 / 16;
    max-height: 100vh;
    padding: 24px 18px;
}

body.reel-mode .logo {
    font-size: clamp(36px, 8vw, 60px);
    letter-spacing: -1px;
}

body.reel-mode .subtitle {
    font-size: 14px;
    letter-spacing: 2px;
}

body.reel-mode .wall {
    height: 90px;
    margin-top: 32px;
    margin-bottom: 25px;
}

body.reel-mode .services {
    gap: 7px;
}

body.reel-mode .services span {
    font-size: 11px;
}

body.reel-mode .cta {
    padding: 14px 17px;
    font-size: 13px;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>
<section class="ad" id="dakshaAd" aria-label="Daksha Paints animated advertisement">

    <div class="paint-stroke stroke-one"></div>
    <div class="paint-stroke stroke-two"></div>

    <div class="splash s1"></div>
    <div class="splash s2"></div>
    <div class="splash s3"></div>
    <div class="splash s4"></div>

    <button class="replay" id="replayButton" type="button">
        ↻ Replay
    </button>

    <main class="content">
        <div class="tag">YOUR HOME • YOUR COLOURS</div>

        <h1 class="logo">DAKSHA PAINTS</h1>

        <p class="subtitle">HOUSE PAINT SERVICE</p>

        <div class="wall" aria-label="Colourful paint shades">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="message">
            <span id="mainMessage">Har Deewar Ki Nayi Pehchaan!</span>
        </div>

        <div class="services">
            <span>Interior Painting</span>
            <span>Exterior Painting</span>
            <span>Texture Design</span>
            <span>Waterproofing</span>
        </div>

        <a class="cta"
           href="https://wa.me/919560165748?text=Namaste%20Daksha%20Paints%2C%20mujhe%20painting%20ka%20quotation%20chahiye."
           target="_blank"
           rel="noopener">
            GET FREE QUOTE ↗
        </a>

        <p class="phone">Call / WhatsApp: 95601 65748</p>
        <p class="location">Serving Gurugram • Make Your Home Beautiful</p>
    </main>

    <div class="progress"></div>
</section>

<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const isReel = params.get("reel") === "1";

    document.body.classList.add(
        isReel ? "reel-mode" : "website-mode"
    );

    const ad = document.getElementById("dakshaAd");
    const replayButton = document.getElementById("replayButton");
    const message = document.getElementById("mainMessage");

    const messages = [
        "Har Deewar Ki Nayi Pehchaan!",
        "Rang Aise, Jo Dil Jeet Lein!",
        "Aapka Ghar, Aapki Pasand!",
        "Daksha Paints — Rangon Ka Naya Andaaz!"
    ];

    let messageIndex = 0;
    let messageTimer;

    function restartAnimation() {
        ad.classList.remove("restarting");
        void ad.offsetWidth;

        const animated = ad.querySelectorAll(
            ".logo, .subtitle, .wall, .message, .services, .cta, .tag"
        );

        animated.forEach(function (element) {
            element.style.animation = "none";
            void element.offsetWidth;
            element.style.animation = "";
        });

        messageIndex = 0;
        message.textContent = messages[messageIndex];

        clearInterval(messageTimer);

        messageTimer = setInterval(function () {
            messageIndex = (messageIndex + 1) % messages.length;
            message.textContent = messages[messageIndex];
        }, 4000);
    }

    replayButton.addEventListener("click", restartAnimation);

    restartAnimation();
})();
</script>
</body>
</html>
